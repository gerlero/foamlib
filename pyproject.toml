[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "foamlib"
version = "1.7.10"
license = "GPL-3.0-only"
license-files = ["LICENSE.txt"]
description = "Pythonic interface for working with OpenFOAM"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Gabriel S. Gerlero", email = "ggerlero@cimec.unl.edu.ar"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
    "Typing :: Typed",
]
dependencies = [
    "aioshutil>=1,<2",
    "multicollections>=1.1.6,<2",
    "numpy>=2,<3",
    "rich>=13,<16",
    "typing-extensions>=4.5,<5; python_version<'3.13'",
]

[project.optional-dependencies]
preprocessing = [
    "pandas>=2.2,<4",
    "pydantic>=2.0.2,<3",
]
postprocessing = [
    "pandas>=2.2,<4",
    "defusedxml>=0.7.1,<0.8",
]
examples = [
    "plotly>=6,<8",
    "scipy>=1.10,<2",
    "foamlib[preprocessing]",
    "foamlib[postprocessing]",
]

[project.urls]
Homepage = "https://github.com/gerlero/foamlib"
Repository = "https://github.com/gerlero/foamlib"
Documentation = "https://foamlib.readthedocs.io"

[dependency-groups]
preprocessing = ["foamlib[preprocessing]"]
postprocessing = ["foamlib[postprocessing]"]
examples = ["foamlib[examples]"]
lint = ["ruff>=0.16.5,<0.17"]
typing = [
    {include-group = "preprocessing"},
    {include-group = "postprocessing"},
    "pandas-stubs>=1,<4",
    "scipy-stubs>=1,<2",
    "ty>=0.0.75,<0.1",
    "types-defusedxml>=0.7,<0.8",
]
test = [
    {include-group = "preprocessing"},
    {include-group = "postprocessing"},
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=7,<8",
    "scipy>=1.10,<2",
]
docs = [
    {include-group = "preprocessing"},
    {include-group = "postprocessing"},
    "sphinx>=9,<10",
    "sphinx_rtd_theme>=3,<4",
    "sphinxcontrib-mermaid>=2,<3",
]
benchmark = ["PyFoam==2026.6"]
dev = [
    {include-group = "preprocessing"},
    {include-group = "postprocessing"},
    {include-group = "examples"},
    {include-group = "lint"},
    {include-group = "typing"},
    {include-group = "test"},
    {include-group = "docs"},
    {include-group = "benchmark"},
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
