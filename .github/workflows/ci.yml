name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Lint with Ruff
      uses: astral-sh/ruff-action@v4.1.0
    - name: Format with Ruff
      uses: astral-sh/ruff-action@v4.1.0
      with:
        args: 'format --check'

  typing:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: pyproject.toml
    - name: Check types with ty
      run: |
        uv run --group typing ty check

  test:
    runs-on: ${{ matrix.os }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - "8888:3306"
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    strategy:
      matrix:
        os: [ubuntu-latest]
        openfoam-version: [2606, 14]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        dependency-resolution: [highest]
        slurm: [false]
        include:
          - os: ubuntu-22.04
            openfoam-version: 2006
            python-version: '3.11'
            dependency-resolution: lowest-direct
            slurm: false
          - os: ubuntu-22.04
            openfoam-version: 9
            python-version: '3.11'
            dependency-resolution: lowest-direct
            slurm: false
          - os: ubuntu-latest
            openfoam-version: 2606
            python-version: '3.14'
            dependency-resolution: highest
            slurm: true
          - os: ubuntu-latest
            openfoam-version: 14
            python-version: '3.14'
            dependency-resolution: highest
            slurm: true
          - os: ubuntu-22.04
            openfoam-version: 2006
            python-version: '3.11'
            dependency-resolution: lowest-direct
            slurm: true
          - os: ubuntu-22.04
            openfoam-version: 9
            python-version: '3.11'
            dependency-resolution: lowest-direct
            slurm: true
      fail-fast: false
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up Slurm
      if: matrix.slurm
      uses: koesterlab/setup-slurm-action@v1
    - name: Set up OpenFOAM
      uses: gerlero/setup-openfoam@v1
      with:
        openfoam-version: ${{ matrix.openfoam-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install test dependencies
      run: |
        uv sync --python ${{ matrix.python-version }} --group test --resolution ${{ matrix.dependency-resolution }}
    - name: Test with pytest
      run: |
        uv run pytest --cov=foamlib --cov-report xml
      env:
        OMPI_MCA_rmaps_base_oversubscribe: 1
        OMPI_ALLOW_RUN_AS_ROOT: 1
        OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
    - name: Upload code coverage results to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
  
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
    - name: Check package build
      run: |
        uv build
